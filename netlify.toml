[[plugins]]
package = "@netlify/plugin-gatsby"

[[plugins]]
package = "@netlify/plugin-lighthouse"

[[plugins]]
package = "@netlify/plugin-sitemap"
  
  [plugins.inputs]
  prettyURLs = true
  trailingSlash = true
  exclude = [
    './public/404.html',
    './public/404/index.html',
    './public/offline-plugin-app-shell-fallback.html',
    './public/offline-plugin-app-shell-fallback/index.html',
  ]

[build.environment]
  NODE_VERSION="18"